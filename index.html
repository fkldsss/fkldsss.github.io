<script>

document.getElementById('mode-toggle-box').addEventListener('pointerdown', function(e) {
    e.stopPropagation();    
    const checkbox = document.getElementById('mode-checkbox');    
    if (e.target === checkbox) return;
    e.preventDefault(); 
    checkbox.checked = !checkbox.checked;
    checkbox.dispatchEvent(new Event('change'));
});

document.getElementById('boundary-toggle-box').addEventListener('pointerdown', function(e) {
    e.stopPropagation();    
    const checkbox = document.getElementById('boundary-checkbox');    
    if (e.target === checkbox) return;
    e.preventDefault(); 
    checkbox.checked = !checkbox.checked;
});

        const thumbnailsContainer = document.getElementById('thumbnails-container');
        const canvasContainer = document.getElementById('canvas-container');
        const deleteBtn = document.getElementById('delete-btn');
        const modeToggleBox = document.getElementById('mode-toggle-box');
        const modeCheckbox = document.getElementById('mode-checkbox');
        const menuBox = document.getElementById('menu-box');
        const arrowIcon = document.getElementById('arrow-icon');
                                
        let stickerCount = 0;
       window.currentMaxZIndex = 10; 
        let selectedSticker = null;
       window.selectedSticker = null;
        let currentAction = null; 
        let targetElement = null;
        let startX, startY;
        let initialLeft, initialTop, initialWidth, initialHeight;
        let resizeTimeout = null;

        function toggleMenuManual() {
            if (menuBox.classList.contains('active-show')) {
                window.hideMenuBox();
            } else {
                window.showMenuBox();
            }
        }

        window.hideMenuBox = function() {
            menuBox.classList.remove('active-show');
            arrowIcon.innerText = "🔼"; 
        };

        window.showMenuBox = function() {
            if (window.templateManager && window.templateManager.isPlaying) return;
            menuBox.classList.add('active-show');
            arrowIcon.innerText = "🔽"; 
        };

        document.getElementById('mode-checkbox').addEventListener('change', function(e) {
        });

        window.clearSelection = function() {
            if (selectedSticker) {
                selectedSticker.classList.remove('selected');

                if (!selectedSticker.classList.contains('locked')) {
                    selectedSticker.style.removeProperty('border');
                    selectedSticker.style.removeProperty('outline');
                    selectedSticker.style.removeProperty('box-shadow');
                }

                const existingLock = selectedSticker.querySelector('.lock-handle');
                if (existingLock) existingLock.remove();

                selectedSticker = null;
                window.selectedSticker = null;
            }
                const floatingLock = document.getElementById('floating-lock');
                if (floatingLock) {
                floatingLock.style.display = 'none';
                floatingLock._targetSticker = null;
            }
            deleteBtn.classList.remove('show');            
            document.getElementById('mode-checkbox').checked = false;           
            modeToggleBox.classList.remove('show');
            document.getElementById('boundary-toggle-box').classList.remove('show');
        };

function updateLockVisibility(sticker) {
    if (!sticker) {
        const floatingLock = document.getElementById('floating-lock');
        if (floatingLock) {
            floatingLock.style.display = 'none';
            floatingLock._targetSticker = null;
        }
        return;
    }

    const threshold = 70;
    const width = sticker.offsetWidth;
    const height = sticker.offsetHeight;
    const isTooSmall = (width < threshold || height < threshold);
    const isSelected = (window.selectedSticker === sticker);
    const floatingLock = document.getElementById('floating-lock');
    const shouldHide = isTooSmall;
    const currentlyHidden = sticker.classList.contains('lock-hidden');
    if (shouldHide !== currentlyHidden) {
        sticker.classList.toggle('lock-hidden', shouldHide);
    }

    const shouldShowFloating = isTooSmall && isSelected;
    if (!floatingLock) return;
    const currentlyVisible = (floatingLock.style.display === 'flex');
    if (shouldShowFloating !== currentlyVisible) {
        floatingLock.style.display = shouldShowFloating ? 'flex' : 'none';
        if (shouldShowFloating) {
            const isZLocked = sticker.getAttribute('data-z-locked') === 'true';
            const isLocked = sticker.classList.contains('locked');
            floatingLock.textContent = isLocked ? (isZLocked ? '🔒⚡' : '🔒') : (isZLocked ? '🔓⚡' : '🔓');
            floatingLock._targetSticker = sticker;
        } else {
            floatingLock._targetSticker = null;
        }
    } else if (shouldShowFloating) {
        const isZLocked = sticker.getAttribute('data-z-locked') === 'true';
        const isLocked = sticker.classList.contains('locked');
        floatingLock.textContent = isLocked ? (isZLocked ? '🔒⚡' : '🔒') : (isZLocked ? '🔓⚡' : '🔓');
    }
}

function selectSticker(element) {
    if (selectedSticker !== element) {
        window.clearSelection();
        selectedSticker = element;
        window.selectedSticker = element;
        selectedSticker.classList.add('selected');

        // ---------- 建立鎖頭按鈕 (保留長按 z-index 鎖定) ----------
        const lockBtn = document.createElement('div');
        lockBtn.className = 'lock-handle';
        lockBtn.innerHTML = element.classList.contains('locked') ? '🔒' : '🔓';
        lockBtn.style.display = 'flex';
        lockBtn.style.alignItems = 'center';
        lockBtn.style.justifyContent = 'center';
        lockBtn.style.userSelect = 'none';
        lockBtn.style.touchAction = 'none'; // 避免觸控時干擾

        let longPressTimer = null;
        let isLongPressTriggered = false;

        // 長按處理 (pointerdown + pointerup)
        const onPointerDown = function(e) {
            e.stopPropagation();
            isLongPressTriggered = false;
            longPressTimer = setTimeout(() => {
                isLongPressTriggered = true;
                // 長按：切換 z-index 鎖定
                const currentZLock = element.getAttribute('data-z-locked') === 'true';
                const newZLock = !currentZLock;
                element.setAttribute('data-z-locked', newZLock ? 'true' : 'false');
                // 更新鎖頭圖示（保留原有鎖定圖示，加上 ⚡ 表示 z 鎖定）
                const isLocked = element.classList.contains('locked');
                lockBtn.innerHTML = isLocked ? (newZLock ? '🔒⚡' : '🔒') : (newZLock ? '🔓⚡' : '🔓');
                // 視覺回饋
                element.style.transition = 'box-shadow 0.35s';
                element.style.boxShadow = newZLock ? '0 0 25px #ffd700' : '0 0 25px #00adb5';
                setTimeout(() => { element.style.boxShadow = ''; }, 300);
            }, 350); // 長按時間 350ms
        };

        const onPointerUp = function(e) {
            e.stopPropagation();
            clearTimeout(longPressTimer);
            // 短按由 click 事件處理，這裡不做任何事
        };

        const onPointerLeave = function(e) {
            clearTimeout(longPressTimer);
        };

        // 綁定長按事件 (pointer)
        lockBtn.addEventListener('pointerdown', onPointerDown);
        lockBtn.addEventListener('pointerup', onPointerUp);
        lockBtn.addEventListener('pointerleave', onPointerLeave);
        // 觸控支援
        lockBtn.addEventListener('touchstart', onPointerDown, { passive: false });
        lockBtn.addEventListener('touchend', onPointerUp, { passive: false });
        lockBtn.addEventListener('touchcancel', onPointerLeave, { passive: false });

        // 短按：點擊切換鎖定狀態 (click 事件)
        lockBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            // 如果剛剛觸發了長按，則忽略這次點擊
            if (isLongPressTriggered) {
                isLongPressTriggered = false; // 重置標誌
                return;
            }
            // 切換 locked 類別
            element.classList.toggle('locked');
            const isLocked = element.classList.contains('locked');
            const isZLocked = element.getAttribute('data-z-locked') === 'true';
            // 更新圖示
            this.innerHTML = isLocked ? (isZLocked ? '🔒⚡' : '🔒') : (isZLocked ? '🔓⚡' : '🔓');
            if (isLocked) {
                window.clearSelection();
            }
        });

        selectedSticker.appendChild(lockBtn);
        updateLockVisibility(element);

        // ---------- z-index 管理（加入鎖定判斷） ----------
        const stickerType = selectedSticker.getAttribute('data-type');
        if (stickerType === 'bg' || stickerType === 'solid' || element.classList.contains('bg-sticker')) {
            element.style.zIndex = 1;
        } else {
            const isZLocked = element.getAttribute('data-z-locked') === 'true';
            if (!isZLocked) {
                window.currentMaxZIndex++;
                element.style.zIndex = window.currentMaxZIndex;
            }
        }
    }

    deleteBtn.classList.add('show');
    modeToggleBox.classList.add('show');
    document.getElementById('boundary-toggle-box').classList.add('show');
}

function deleteSelectedSticker() {            if (window.templateManager && window.templateManager.isPlaying) {                return;            }            if (selectedSticker) {        if (selectedSticker.classList.contains('locked')) {            selectedSticker.style.transition = 'transform 0.1s ease';            selectedSticker.style.outline = '4px solid #ff5252';            setTimeout(() => {                selectedSticker.style.outline = 'none';            }, 200);                        return;        }                selectedSticker.remove();                window.clearSelection();            }}


// 💡 新增：垃圾桶長按 0.95 秒一鍵清除 + 轉圈動畫功能
const delBtn = document.getElementById('delete-btn');
let deleteLongPressTimer = null;
let isLongPressTriggered = false;

function startDeleteLongPress(e) {
    if (window.templateManager && window.templateManager.isPlaying) return;
    e.preventDefault(); 
    isLongPressTriggered = false;
    
    delBtn.classList.add('charging');
    
    deleteLongPressTimer = setTimeout(() => {
        isLongPressTriggered = true;
        delBtn.classList.remove('charging');
        
        const confirmAll = confirm("⚠️ 確定要一鍵清除畫布上所有「未鎖定」的貼紙嗎？");
        if (confirmAll) {
            const allStickers = canvasContainer.querySelectorAll('.sticker');
            allStickers.forEach(sticker => {
                // 核心邏輯：只要貼紙沒有 locked 類別，一律清除；否則安全保留
                if (!sticker.classList.contains('locked')) {
                    sticker.remove();
                }
            });
            window.clearSelection();
        }
    }, 950); // 0.95秒
}

function cancelDeleteLongPress(e) {
    delBtn.classList.remove('charging');

    if (deleteLongPressTimer) {
        clearTimeout(deleteLongPressTimer);
        deleteLongPressTimer = null;
    }
    if (!isLongPressTriggered && e.type !== 'mouseleave') {
        deleteSelectedSticker();
    }
}

delBtn.addEventListener('mousedown', startDeleteLongPress);
delBtn.addEventListener('mouseup', cancelDeleteLongPress);
delBtn.addEventListener('mouseleave', () => {
    delBtn.classList.remove('charging'); 
    if (deleteLongPressTimer) clearTimeout(deleteLongPressTimer);
});

delBtn.addEventListener('touchstart', startDeleteLongPress, { passive: false });
delBtn.addEventListener('touchend', cancelDeleteLongPress);
delBtn.addEventListener('touchcancel', () => {
    delBtn.classList.remove('charging');
    if (deleteLongPressTimer) clearTimeout(deleteLongPressTimer);
});
// ==========================================
// ---------- 全部解鎖 / 長按清空畫布 ----------
const unlockBtn = document.getElementById('btn-unlock-all');
if (unlockBtn) {
    let pressTimer = null;
    let isLongPress = false;

    // 取得按鈕內部的圖示元素（不影響外層結構）
    const iconSpan = unlockBtn.querySelector('.icon-label');

    // 開始長按計時
    function startUnlockLongPress(e) {
        if (window.templateManager && window.templateManager.isPlaying) return;
        e.preventDefault();
        isLongPress = false;

        // 添加長按特效（變紅＋微震）— 只改 class，不改內容
        unlockBtn.classList.add('charging');
        // 只改圖示，不更動整個 innerHTML
        if (iconSpan) iconSpan.textContent = '🗑️';

        pressTimer = setTimeout(() => {
            isLongPress = true;
            unlockBtn.classList.remove('charging');
            // 彈出確認
            if (confirm('⚠️ 確定要清空畫布上「所有」貼紙嗎？\n（鎖定的貼紙也會被刪除）')) {
                const allStickers = canvasContainer.querySelectorAll('.sticker');
                allStickers.forEach(sticker => {
                    sticker.remove();
                });
                window.clearSelection();
            }
            // 恢復圖示
            if (iconSpan) iconSpan.textContent = '🔓';
        }, 950);
    }

    function cancelUnlockLongPress(e) {
        unlockBtn.classList.remove('charging');
        if (pressTimer) {
            clearTimeout(pressTimer);
            pressTimer = null;
        }
        // 如果沒有觸發長按（短按），執行全部解鎖

function handleStart(e) {
    const target = e.target;
    
    // 若範本播放中，禁止任何操作
    if (window.templateManager && window.templateManager.isPlaying) {
        return;
    }

    if (selectedSticker) {
        // 僅在非動畫且非鎖定狀態下，清理邊框的 Inline 樣式
        const isAnimating = [
            'breathing-effect', 'spin-effect', 'shake-effect', 
            'blink-effect', 'float-effect', 'skewx-effect',
            'skewy-effect', 'swing-up-down-effect', 'jump-n-shake-effect', 'tilt-n-move-shaking-effect', 'flip-card'
        ].some(effect => selectedSticker.classList.contains(effect));
        
        if (!isAnimating && !selectedSticker.classList.contains('locked')) {
            selectedSticker.style.removeProperty('border');
            selectedSticker.style.removeProperty('outline');
            selectedSticker.style.removeProperty('box-shadow');
        }
    }

    // 若點擊的是非操作區域，則忽略
    if (target.closest('#menu-box') || target.closest('.side-drawer') || target.closest('#txt-export-overlay') || target.closest('#delete-btn') || target.closest('#mode-toggle-box')) {
        return;
    }

    const isSticker = target.classList.contains('sticker') || target.tagName === 'SPAN';
    const isHandle = target.classList.contains('resize-handle');
    const isRotate = target.classList.contains('rotate-handle');
    const isExpand = target.classList.contains('expand-handle');

    // 🔥 點擊空白處 → 取消選取（修復手柄殘留 bug）
    if (!isSticker && !isHandle && !isRotate && !isExpand) {
        window.clearSelection();
        return;
    }

    if (isExpand) return; // Expand 功能由獨立 click 事件處理

    const element = target.closest('.sticker');
    if (!element) return;

    // 鎖定狀態下僅允許選取，不允許拖曳操作
    if (element.classList.contains('locked') && (!isHandle && !isRotate)) {
        selectSticker(element);
        return;
    }
    if (element.classList.contains('locked')) return;

    e.stopPropagation();
    target.setPointerCapture(e.pointerId);
    selectSticker(element);
    
    // 設定當前操作模式
    if (isRotate) {
        currentAction = 'rotate';
    } else {
        currentAction = isHandle ? 'resize' : 'drag';
    }
    
    targetElement = element;
    targetElement.style.willChange = 'left, top, width, height, transform';
    targetElement.classList.add('is-dragging');
    targetElement._isImage = !!(targetElement.style.backgroundImage && targetElement.style.backgroundImage !== 'none');
    
    startX = e.clientX;
    startY = e.clientY;
    initialLeft = element.offsetLeft;
    initialTop = element.offsetTop;
    initialWidth = element.offsetWidth;
    initialHeight = element.offsetHeight;

    const rect = element.getBoundingClientRect();
    element._centerX = rect.left + rect.width / 2;
    element._centerY = rect.top + rect.height / 2;
    element._startAngle = parseFloat(element.getAttribute('data-angle')) || 0;
    element._baseAngle = Math.atan2(e.clientY - element._centerY, e.clientX - element._centerX);
}

function handleMove(e) {
    if (!currentAction || !targetElement) return;

    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    if (currentAction === 'drag') {
        const screenWidth = window.innerWidth;
        const screenHeight = window.innerHeight;
        const elWidth = targetElement.offsetWidth;
        const elHeight = targetElement.offsetHeight;
        const snapThreshold = 6;
        const overflowBuffer = 20;
        const resistanceThreshold = 6;

        let newLeft = initialLeft + dx;
        let newTop = initialTop + dy;
        
        // 檢查是否啟用無邊界模式
        const isUnrestricted = document.getElementById('boundary-checkbox') && document.getElementById('boundary-checkbox').checked;

        if (!isUnrestricted) {
            // 邊緣吸附邏輯
            if (Math.abs(newLeft) < snapThreshold) newLeft = 0;
            if (Math.abs(newLeft - (screenWidth - elWidth)) < snapThreshold) newLeft = screenWidth - elWidth;
            if (Math.abs(newTop) < snapThreshold) newTop = 0;
            if (Math.abs(newTop - (screenHeight - elHeight)) < snapThreshold) newTop = screenHeight - elHeight;

            const isAtLeft = initialLeft <= 0;
            const isAtRight = initialLeft >= (screenWidth - elWidth);
            const isAtTop = initialTop <= 0;
            const isAtBottom = initialTop >= (screenHeight - elHeight);

            // 邊緣阻尼邏輯
            if ((isAtLeft && dx < 0) || (isAtRight && dx > 0)) {
                let dist = isAtLeft ? Math.abs(newLeft) : (newLeft - (screenWidth - elWidth));
                if (dist < resistanceThreshold) {
                    newLeft = isAtLeft ? 0 : (screenWidth - elWidth);
                } else {
                    let clampedDist = Math.min(dist, overflowBuffer);
                    newLeft = isAtLeft ? -clampedDist : (screenWidth - elWidth + clampedDist);
                }
            }
            if ((isAtTop && dy < 0) || (isAtBottom && dy > 0)) {
                let dist = isAtTop ? Math.abs(newTop) : (newTop - (screenHeight - elHeight));
                if (dist < resistanceThreshold) {
                    newTop = isAtTop ? 0 : (screenHeight - elHeight);
                } else {
                    let clampedDist = Math.min(dist, overflowBuffer);
                    newTop = isAtTop ? -clampedDist : (screenHeight - elHeight + clampedDist);
                }
            }
        }

        targetElement.style.left = newLeft + 'px';
        targetElement.style.top = newTop + 'px';
        targetElement._centerX = newLeft + elWidth / 2;
        targetElement._centerY = newTop + elHeight / 2;
    } 
    else if (currentAction === 'resize') {
        let newWidth = initialWidth + dx;
        let newHeight = initialHeight + dy;

       if (targetElement._isImage) {
            if (modeCheckbox.checked) {
                targetElement.style.backgroundSize = '100% 100%';
            } else {
                targetElement.style.backgroundSize = 'contain';
            }
        }

        if (modeCheckbox.checked) {
            targetElement.style.backgroundSize = '100% 100%';
            targetElement.style.width = newWidth + 'px';
            targetElement.style.height = newHeight + 'px';
            updateLockVisibility(targetElement);
        } else {
            targetElement.style.backgroundSize = 'contain';
            const ratioX = newWidth / initialWidth;
            const ratioY = newHeight / initialHeight;
            const scale = Math.max(ratioX, ratioY);
            targetElement.style.width = (initialWidth * scale) + 'px';
            targetElement.style.height = (initialHeight * scale) + 'px';
            updateLockVisibility(targetElement);
        }
    } 
    else if (currentAction === 'rotate') {
        const currentAngle = Math.atan2(e.clientY - targetElement._centerY, e.clientX - targetElement._centerX);
        const angleDiff = currentAngle - targetElement._baseAngle;
        let newAngle = targetElement._startAngle + angleDiff * (180 / Math.PI);
        newAngle = (newAngle % 360 + 360) % 360;
        targetElement.setAttribute('data-angle', newAngle);
        targetElement.style.transform = `rotate(${newAngle}deg)`;
    }
}

        window.addEventListener('pointerdown', handleStart);
        window.addEventListener('pointermove', handleMove);
        window.addEventListener('pointerup', handleEnd);
        window.addEventListener('pointercancel', handleEnd);
        window.addEventListener('touchcancel', handleEnd);

        function handleEnd() {
    if (targetElement) {
        const isUnrestricted = document.getElementById('boundary-checkbox') && document.getElementById('boundary-checkbox').checked;
        
        if (!isUnrestricted) {
            const parent = targetElement.parentElement || canvasContainer;
            const parentWidth = parent.clientWidth;
            const parentHeight = parent.clientHeight;            
            let currentLeft = parseFloat(targetElement.style.left) || 0;
            let currentTop = parseFloat(targetElement.style.top) || 0;            
            const elWidth = targetElement.offsetWidth;
            const elHeight = targetElement.offsetHeight;
            
            const maxOverflow = 40;
            
            if (currentLeft < -maxOverflow) {
                targetElement.style.left = -maxOverflow + 'px';
            } else if (currentLeft + elWidth > parentWidth + maxOverflow) {
                targetElement.style.left = (parentWidth - elWidth + maxOverflow) + 'px';
            }            
            if (currentTop < -maxOverflow) {
                targetElement.style.top = -maxOverflow + 'px';
            } else if (currentTop + elHeight > parentHeight + maxOverflow) {
                targetElement.style.top = (parentHeight - elHeight + maxOverflow) + 'px';
            }
        }        
        targetElement.style.willChange = 'auto';
        targetElement.classList.remove('is-dragging');
    }
    currentAction = null;
    targetElement = null;
}

        window.addEventListener('resize', function() {
    if (resizeTimeout) clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
        const isUnrestricted = document.getElementById('boundary-checkbox') && document.getElementById('boundary-checkbox').checked;
        
        if (!isUnrestricted) {
            document.querySelectorAll('.sticker').forEach(sticker => {
                let currentLeft = sticker.offsetLeft;
                let currentTop = sticker.offsetTop;
                const maxLeft = window.innerWidth - sticker.offsetWidth;
                const maxTop = window.innerHeight - sticker.offsetHeight;
                if (currentLeft > maxLeft) sticker.style.left = Math.max(0, maxLeft) + 'px';
                if (currentTop > maxTop) sticker.style.top = Math.max(0, maxTop) + 'px';
            });
        }
        
        // 手機轉向時，背景貼紙自動重新鋪滿
        const bgSticker = document.querySelector('.bg-sticker');
        if (bgSticker) {
            const isFullscreen = bgSticker.offsetWidth >= window.innerWidth - 10 || 
                                 bgSticker.offsetHeight >= window.innerHeight - 10;
            if (isFullscreen) {
                bgSticker.style.backgroundSize = '100% 100%';
                bgSticker.style.width = '100vw';
                bgSticker.style.height = '100vh';
                bgSticker.style.left = '0px';
                bgSticker.style.top = '0px';
                bgSticker.style.transform = 'rotate(0deg)';
                bgSticker.setAttribute('data-angle', '0');
            }
        }
    }, 100);
});

// --- 動畫套用邏輯 ---
document.getElementById('animation-selector').addEventListener('change', function() {

        ];
        // 遍歷每張貼紙，移除所有特效類別
        allStickers.forEach(sticker => {

            sticker.style.removeProperty('border');

            sticker.style.removeProperty('box-shadow');

        // 清除完成後，將下拉選單設回「無特效」

        'breathing-effect', 'spin-effect', 'shake-effect', 
        'blink-effect', 'float-effect', 'skewx-effect', 
        'skewy-effect', 'swing-up-down-effect', 'jump-n-shake-effect', 'tilt-n-move-shaking-effect', 'flip-card-effect'
    ];
    
    selectedSticker.classList.remove(...effects);
    
    if (selectedEffect !== 'none') {
        selectedSticker.classList.add(selectedEffect);
    }

    selectedSticker.style.removeProperty('border');
    selectedSticker.style.removeProperty('outline');
    selectedSticker.style.removeProperty('box-shadow');
});

        switchCategory('bg', null);
        window.showMenuBox();
    }, 50);

// 側邊欄收合邏輯
document.querySelectorAll('.side-drawer').forEach(panel => {
    panel.addEventListener('click', function(e) {
        if (window.templateManager && window.templateManager.isPlaying && this.id === 'right-command-panel') {
            e.stopPropagation();
            return; // 播放中點右欄，什麼事都不做
        }

        if (e.target === this || e.target.classList.contains('panel-title')) {
            this.classList.toggle('active');
        }
        e.stopPropagation();
    });
});

document.getElementById('canvas-container').addEventListener('click', function(e) {
    if (e.target === this) {
        window.clearSelection();
        
        document.querySelectorAll('.side-drawer').forEach(p => p.classList.remove('active'));
        window.hideMenuBox()
    }
});
// ============================================================
//  🎭 透明度控制 (完全不干擾選取邏輯)
// ============================================================
(function() {
    const header = document.getElementById('opacity-toggle-header');
    const content = document.getElementById('opacity-content');
    const icon = document.getElementById('opacity-toggle-icon');
    const slider = document.getElementById('opacity-slider');
    const resetBtn = document.getElementById('opacity-reset-btn');

    let isOpen = false;

    // ---------- 折疊開關 ----------
    header.addEventListener('click', function(e) {
        e.stopPropagation();
        isOpen = !isOpen;
        if (isOpen) {
            content.style.display = 'block';
            icon.textContent = '▼';
            // 展開時，啟用滑桿並讀取當前選中貼紙的透明度
            updateSliderFromSelected();
        } else {
            content.style.display = 'none';
            icon.textContent = '▶';
            // 收合時可選擇禁用滑桿（但不禁用也可以）
            slider.disabled = true;
        }
    });

    // ---------- 從 selectedSticker 更新滑桿 ----------
    function updateSliderFromSelected() {
        const sticker = window.selectedSticker; // 直接讀取全域變數
        if (!sticker) {
            slider.disabled = true;
            return;
        }
        // 檢查是否為 solid 背景
        if (sticker.getAttribute('data-text-content') === 'solid') {
            slider.disabled = true;
            return;
        }
        const currentOpacity = parseFloat(sticker.style.opacity);
        const percent = isNaN(currentOpacity) ? 100 : Math.round(currentOpacity * 100);
        slider.value = percent;
        slider.disabled = false;
    }

    // ---------- 滑桿拖動事件 ----------
    slider.addEventListener('input', function() {
        const sticker = window.selectedSticker;
        if (!sticker) return;
        if (sticker.getAttribute('data-text-content') === 'solid') return;
        const percent = parseInt(this.value);
        sticker.style.opacity = percent / 100;
    });

    // ---------- 重置按鈕 ----------
    resetBtn.addEventListener('click', function() {
        const sticker = window.selectedSticker;
        if (!sticker) return;
        if (sticker.getAttribute('data-text-content') === 'solid') return;
        sticker.style.opacity = 1;
        slider.value = 100;
    });

    // ---------- 監聽貼紙選取變更 (使用 pointerdown 事件) ----------
    document.addEventListener('pointerdown', function(e) {
        // 如果點擊的是透明度控制本身或其內部，不做任何事（讓它保持展開）
        if (e.target.closest('#opacity-toggle-header') || e.target.closest('#opacity-content')) {
            return;
        }

        if (isOpen) {
            content.style.display = 'none';
            icon.textContent = '▶';
            slider.disabled = true;
            isOpen = false;
            return; // 收合後不再執行後續
        }

        // 如果點擊的是貼紙（且控制已展開，但理論上已收合，所以不會進來這裡）
        // 保留原本的更新邏輯（但由於上方已 return，實際上不會執行到）
        // 但如果之後想保留，可以放在這裡
    });

    // ---------- 初始化 ----------
    slider.disabled = true; // 預設禁用

    console.log('🎭 透明度控制 (獨立版) 已啟用');
})();
// ============================================================
//  長按標籤變淡 4%（左側、右側、底部）
// ============================================================
(function() {
    // 取得三個標籤元素（左側面板的偽元素需要透過面板本身控制）
    const leftPanel = document.getElementById('left-template-panel');
    const rightPanel = document.getElementById('right-command-panel');
    const menuTab = document.getElementById('menu-toggle-tab');

    function addDimClass(el) {
        if (!el) return;
        el.classList.add('dimmed');
    }
    function removeDimClass(el) {
        if (!el) return;
        el.classList.remove('dimmed');
    }

    // 為每個元素綁定 pointer 事件（同時支援滑鼠和觸控）
    const targets = [leftPanel, rightPanel, menuTab];
    targets.forEach(el => {
        if (!el) return;

        // 按下時添加 .dimmed
        el.addEventListener('pointerdown', function(e) {
            // 避免干擾內部按鈕的點擊（例如右側面板內的按鈕）
            // 如果點擊的是內部元素，不觸發長按效果（只針對標籤本身）
            // 但標籤本身通常是偽元素或點擊區域，因此直接添加
            addDimClass(this);
        });

        // 鬆開或離開時移除 .dimmed
        el.addEventListener('pointerup', function(e) {
            removeDimClass(this);
        });
        el.addEventListener('pointerleave', function(e) {
            removeDimClass(this);
        });
        el.addEventListener('pointercancel', function(e) {
            removeDimClass(this);
        });
    });

    console.log('✅ 長按標籤變淡功能已啟用');
})();
// ---------- 浮動鎖頭 事件綁定（獨立於 selectSticker，直接使用 window.selectedSticker） ----------
(function() {
    const floatingLock = document.getElementById('floating-lock');
    if (!floatingLock) return;

    let floatingPressTimer = null;
    let floatingIsLongPress = false;

    const onFloatingPointerDown = function(e) {
        e.stopPropagation();
        const sticker = window.selectedSticker;
        if (!sticker) return;
        floatingIsLongPress = false;
        floatingPressTimer = setTimeout(() => {
            floatingIsLongPress = true;
            const currentZLock = sticker.getAttribute('data-z-locked') === 'true';
            const newZLock = !currentZLock;
            sticker.setAttribute('data-z-locked', newZLock ? 'true' : 'false');
            const isLocked = sticker.classList.contains('locked');
            floatingLock.textContent = isLocked ? (newZLock ? '🔒⚡' : '🔒') : (newZLock ? '🔓⚡' : '🔓');
            sticker.style.transition = 'box-shadow 0.35s';
            sticker.style.boxShadow = newZLock ? '0 0 25px #ffd700' : '0 0 25px #00adb5';
            setTimeout(() => { sticker.style.boxShadow = ''; }, 300);
            const originalLock = sticker.querySelector('.lock-handle');
            if (originalLock) {
                const isLockedNow = sticker.classList.contains('locked');
                originalLock.textContent = isLockedNow ? (newZLock ? '🔒⚡' : '🔒') : (newZLock ? '🔓⚡' : '🔓');
            }
        }, 500);
    };

    const onFloatingPointerUp = function(e) {
        e.stopPropagation();
        clearTimeout(floatingPressTimer);
        const sticker = window.selectedSticker;
        if (!sticker) return;
        if (!floatingIsLongPress) {
            sticker.classList.toggle('locked');
            const isLocked = sticker.classList.contains('locked');
            const isZLocked = sticker.getAttribute('data-z-locked') === 'true';
            floatingLock.textContent = isLocked ? (isZLocked ? '🔒⚡' : '🔒') : (isZLocked ? '🔓⚡' : '🔓');
            const originalLock = sticker.querySelector('.lock-handle');
            if (originalLock) {
                originalLock.textContent = isLocked ? (isZLocked ? '🔒⚡' : '🔒') : (isZLocked ? '🔓⚡' : '🔓');
            }
        }
        floatingIsLongPress = false;
    };

    const onFloatingPointerLeave = function(e) {
        clearTimeout(floatingPressTimer);
        floatingIsLongPress = false;
    };

    floatingLock.addEventListener('pointerdown', onFloatingPointerDown);
    floatingLock.addEventListener('pointerup', onFloatingPointerUp);
    floatingLock.addEventListener('pointerleave', onFloatingPointerLeave);

    floatingLock.addEventListener('touchstart', onFloatingPointerDown, { passive: false });
    floatingLock.addEventListener('touchend', onFloatingPointerUp, { passive: false });
    floatingLock.addEventListener('touchcancel', onFloatingPointerLeave, { passive: false });

    console.log('✅ 浮動鎖頭已獨立綁定，直接使用 window.selectedSticker');
})();
</script>
