    <span style="cursor: pointer; user-select: none;">自由變形</span>
</div>

    <div id="menu-box">
        <div id="menu-toggle-tab" onclick="toggleMenuManual()">
            <span id="arrow-icon">🔽</span> <span id="tab-text">拼貼選單</span>
        </div>
        <div id="category-container">
            <input type="file" id="local-file-input" accept="image/*" style="display: none;">
            <button id="btn-local-upload" class="category-btn" style="border-color: #e91e63; color: #e91e63;">📂 上傳</button>
            <button id="btn-head" class="category-btn" onclick="switchCategory('head', event)">頭部</button>
            <button id="btn-hair" class="category-btn" onclick="switchCategory('hair', event)">髮型</button>
            <button id="btn-face" class="category-btn" onclick="switchCategory('face', event)">五官</button>
            <button id="btn-body" class="category-btn" onclick="switchCategory('body', event)">身體</button>
            <button id="btn-limbs" class="category-btn" onclick="switchCategory('limbs', event)">手腳</button>
            <button id="btn-bg" class="category-btn" onclick="switchCategory('bg', event)">背景</button>
            <button id="btn-text" class="category-btn" onclick="switchCategory('text', event)">文字</button>
            <button id="btn-drawing" class="category-btn" onclick="switchCategory('drawing', event)">繪製</button>
        </div>
        <div id="thumbnails-container"></div>
    </div>

<script>

document.getElementById('mode-toggle-box').addEventListener('pointerdown', function(e) {
    e.stopPropagation();    
    const checkbox = document.getElementById('mode-checkbox');    
    if (e.target === checkbox) return;
    e.preventDefault(); 
    checkbox.checked = !checkbox.checked;
    checkbox.dispatchEvent(new Event('change'));
});

        const thumbnailsContainer = document.getElementById('thumbnails-container');
        const canvasContainer = document.getElementById('canvas-container');
        const deleteBtn = document.getElementById('delete-btn');
        const modeToggleBox = document.getElementById('mode-toggle-box');
        const modeCheckbox = document.getElementById('mode-checkbox');
        const menuBox = document.getElementById('menu-box');
        const arrowIcon = document.getElementById('arrow-icon');
                                
        let stickerCount = 0;
       window.currentMaxZIndex = 10; 
        let selectedSticker = null;
        let currentAction = null; 
        let targetElement = null;
        let activeTouchId = null; 
        let startX, startY;
        let initialLeft, initialTop, initialWidth, initialHeight;
        let resizeTimeout = null;

        function toggleMenuManual() {
            if (menuBox.classList.contains('active-show')) {
                window.hideMenuBox();
            } else {
                window.showMenuBox();
            }
        }

        window.hideMenuBox = function() {
            menuBox.classList.remove('active-show');
            arrowIcon.innerText = "🔼"; 
        };

        window.showMenuBox = function() {
            if (window.templateManager && window.templateManager.isPlaying) return;
            menuBox.classList.add('active-show');
            arrowIcon.innerText = "🔽"; 
        };

        document.getElementById('mode-checkbox').addEventListener('change', function(e) {
        });

        canvasContainer.addEventListener('touchstart', function(e) {
            if (e.target === canvasContainer) window.clearSelection();
        });

        window.clearSelection = function() {
            if (selectedSticker) {
                selectedSticker.classList.remove('selected');
                selectedSticker = null;
            }
            deleteBtn.classList.remove('show');            
            document.getElementById('mode-checkbox').checked = false;           
            modeToggleBox.classList.remove('show');
        };

function selectSticker(element) {
    if (selectedSticker !== element) {
        window.clearSelection();
        selectedSticker = element;
        selectedSticker.classList.add('selected');
        
        const stickerType = selectedSticker.getAttribute('data-type');
        
        // --- 【核心修復】：精準隔離背景！只要不是 bg 且不是 solid，不論是 limbs、head 還是上傳物件，一律平視為一般貼紙 ---
        if (stickerType === 'bg' || stickerType === 'solid' || element.classList.contains('bg-sticker')) {
            // 只有真正的背景物件強制鎖死在最底層
            element.style.zIndex = 1;
        } else {
            // 所有一般貼紙（含上傳物件）平起平坐，點擊時立刻提至當前最高層級
            window.currentMaxZIndex++;
            element.style.zIndex = window.currentMaxZIndex;
        }
    }

    deleteBtn.classList.add('show'); 
    modeToggleBox.classList.add('show');
}

function deleteSelectedSticker() {            if (window.templateManager && window.templateManager.isPlaying) {                return;            }            if (selectedSticker) {        if (selectedSticker.classList.contains('locked')) {            selectedSticker.style.transition = 'transform 0.1s ease';            selectedSticker.style.outline = '4px solid #ff5252';            setTimeout(() => {                selectedSticker.style.outline = 'none';            }, 200);                        return;        }                selectedSticker.remove();                window.clearSelection();            }}


// 💡 新增：垃圾桶長按 0.95 秒一鍵清除 + 轉圈動畫功能
const delBtn = document.getElementById('delete-btn');
let deleteLongPressTimer = null;
let isLongPressTriggered = false;

function startDeleteLongPress(e) {
    if (window.templateManager && window.templateManager.isPlaying) return;
    e.preventDefault(); 
    isLongPressTriggered = false;
    
    delBtn.classList.add('charging');
    
    deleteLongPressTimer = setTimeout(() => {
        isLongPressTriggered = true;
        delBtn.classList.remove('charging');
        
        const confirmAll = confirm("⚠️ 確定要一鍵清除畫布上所有「未鎖定」的貼紙嗎？");
        if (confirmAll) {
            const allStickers = canvasContainer.querySelectorAll('.sticker');
            allStickers.forEach(sticker => {
                // 核心邏輯：只要貼紙沒有 locked 類別，一律清除；否則安全保留
                if (!sticker.classList.contains('locked')) {
                    sticker.remove();
                }
            });
            window.clearSelection();
        }
    }, 950); // 0.95秒
}

function cancelDeleteLongPress(e) {
    delBtn.classList.remove('charging');

    if (deleteLongPressTimer) {
        clearTimeout(deleteLongPressTimer);
        deleteLongPressTimer = null;
    }
    if (!isLongPressTriggered && e.type !== 'mouseleave') {
        deleteSelectedSticker();
    }
}

delBtn.addEventListener('mousedown', startDeleteLongPress);
delBtn.addEventListener('mouseup', cancelDeleteLongPress);
delBtn.addEventListener('mouseleave', () => {
    delBtn.classList.remove('charging'); 
    if (deleteLongPressTimer) clearTimeout(deleteLongPressTimer);
});

delBtn.addEventListener('touchstart', startDeleteLongPress, { passive: false });
delBtn.addEventListener('touchend', cancelDeleteLongPress);
delBtn.addEventListener('touchcancel', () => {
    delBtn.classList.remove('charging');
    if (deleteLongPressTimer) clearTimeout(deleteLongPressTimer);
});
// ==========================================

window.addEventListener('keydown', function(e) {            if (e.key === 'Delete' || e.key === 'Backspace') deleteSelectedSticker();        });
function switchCategory(categoryName, e) {
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            if (e && e.target) {
                e.target.classList.add('active');
            } else {
                const targetBtn = document.getElementById('btn-' + categoryName);
                if (targetBtn) targetBtn.classList.add('active');
            }

            const oldThumbs = thumbnailsContainer.querySelectorAll('.thumb-item');
            oldThumbs.forEach(thumb => { thumb.onclick = null; });
            thumbnailsContainer.innerHTML = '';

            const folderPath = window.imageFolder || '';
            const items = window.stickerData ? window.stickerData[categoryName] : null;
                                                
            if (items) {
                items.forEach(itemText => {
                    const thumbDiv = document.createElement('div');
                    thumbDiv.className = 'thumb-item';

                    const isImage = /\.(jpg|jpeg|png|gif|webp)$/i.test(itemText);

                    if (isImage) {
                        const img = document.createElement('img');
                        img.src = folderPath + itemText;
                        thumbDiv.appendChild(img);
                                                                
                        thumbDiv.onclick = function() { 
                             window.createSticker(folderPath + itemText, categoryName, true); 
                             window.hideMenuBox(); 
                        };
                    } else {
                        thumbDiv.classList.add('thumb-text-render');
                        thumbDiv.innerText = itemText;

                        thumbDiv.onclick = function() { 
                             window.createSticker(itemText, categoryName, false); 
                             window.hideMenuBox(); 
                        };
                    }
                    thumbnailsContainer.appendChild(thumbDiv);
                });
            }
        }

window.createSticker = function createSticker(content, category, isImage) {
    if (content === 'solid') {
        const existingSolid = document.querySelector('.sticker[data-text-content="solid"]');
        if (existingSolid) {
            existingSolid.remove();
        }
    }
    stickerCount++;
    const newSticker = document.createElement('div');
    newSticker.className = 'sticker';
    newSticker.id = 'sticker-' + stickerCount;
    newSticker.setAttribute('data-angle', '0');

    newSticker.setAttribute('data-type', category);
    newSticker.setAttribute('data-src', isImage ? content : '');
    newSticker.setAttribute('data-text-content', !isImage ? content : '');

    if (isImage) {
        newSticker.style.backgroundImage = `url('${content}')`;
    } else {
        newSticker.style.backgroundColor = 'transparent';
        newSticker.style.display = 'flex';
        newSticker.style.alignItems = 'center';
        newSticker.style.justifyContent = 'center';
        newSticker.style.containerType = 'inline-size';
        
        const span = document.createElement('span');
        span.className = 'text-content';
        span.innerText = content;
        newSticker.appendChild(span);
    }

    const screenWidth = window.innerWidth;
    const screenHeight = window.innerHeight;
    const randomOffset = Math.random() * 20;

    // 定位邏輯
// 定位邏輯
    if (category === 'bg') {
        newSticker.classList.add('bg-sticker');
        newSticker.style.position = 'absolute';

        // --- 核心邏輯修正：預先設定好初始寬高，方便計算精準置中像素 ---
        let initialW = 120; // 預設普通貼紙寬高
        let initialH = 120;

        if (content === 'solid') {
            initialW = window.innerWidth;
            initialH = window.innerHeight;
            newSticker.style.width = '100vw';
            newSticker.style.height = '100vh';
            newSticker.style.backgroundColor = '#ffffff';
            newSticker.classList.add('locked');
            window.clearSelection();
        } else {
            newSticker.style.width = initialW + 'px';
            newSticker.style.height = initialH + 'px';
            newSticker.style.backgroundSize = '100% 100%';
        }

        // --- 核心邏輯點：直接用 JS 算出絕對坐標像素，拒絕 transform 偽置中 ---
        const pixelLeft = (window.innerWidth - initialW) / 2;
        const pixelTop = (window.innerHeight - initialH) / 2;
        
        newSticker.style.left = pixelLeft + 'px';
        newSticker.style.top = pixelTop + 'px';
        newSticker.style.transform = 'rotate(0deg)'; // 初始旋轉度為 0

        newSticker.style.zIndex = '1';
        newSticker.style.cursor = 'default';
        
        const textSpan = newSticker.querySelector('span');
        if (textSpan) { textSpan.remove(); }
        
        const handle = document.createElement('div');
        handle.className = 'resize-handle';
        newSticker.appendChild(handle);
        
        const expandBtn = document.createElement('div');
        expandBtn.className = 'expand-handle';
        expandBtn.innerHTML = '⤢'; // 鋪滿圖示
        expandBtn.onclick = function(e) {
            e.stopPropagation();
            newSticker.style.width = '100vw';
            newSticker.style.height = '100vh';
            // 鋪滿時同樣寫死成 0, 0 絕對像素，不再使用百分比與 translate
            newSticker.style.left = '0px';
            newSticker.style.top = '0px';
            newSticker.style.transform = 'rotate(0deg)';
            newSticker.setAttribute('data-angle', '0');
        };
        newSticker.appendChild(expandBtn);

        if (content === 'solid') {
            const colorInput = document.createElement('input');
            colorInput.type = 'color';
            colorInput.className = 'hidden-color-picker';
            colorInput.style.display = 'none'; 
            colorInput.value = '#ffffff';

            const colorBtn = document.createElement('div');
            colorBtn.className = 'color-handle';
            colorBtn.innerHTML = '🎨';
            colorBtn.onclick = function(e) {
                e.stopPropagation();
                colorInput.click();
            };
            
            colorInput.addEventListener('input', (e) => { 
                newSticker.style.backgroundColor = e.target.value; 
            });
            
            newSticker.appendChild(colorBtn);
            newSticker.appendChild(colorInput);
        }
    } else {
        if (category === 'text') {
            newSticker.style.left = (screenWidth / 2 - 100 + randomOffset) + 'px';
            newSticker.style.top = (screenHeight / 2 - 30 + randomOffset) + 'px';
            window.currentMaxZIndex++;
            newSticker.style.zIndex = window.currentMaxZIndex;
        } else {
            newSticker.style.left = (screenWidth / 2 - 60 + randomOffset) + 'px';
            newSticker.style.top = (screenHeight / 2 - 120 + randomOffset) + 'px';
            window.currentMaxZIndex++;
            newSticker.style.zIndex = window.currentMaxZIndex;
        }

        const handle = document.createElement('div');
        handle.className = 'resize-handle';
        newSticker.appendChild(handle);
        
        const rotateHandle = document.createElement('div');
        rotateHandle.className = 'rotate-handle';
        newSticker.appendChild(rotateHandle);
    }

    // 調色盤邏輯 (text/drawing)
    if (category === 'text' || category === 'drawing') {
        const paletteBtn = document.createElement('div');
        paletteBtn.className = 'palette-handle';
        paletteBtn.innerHTML = '🎨';
        const colorInput = document.createElement('input');
        colorInput.type = 'color';
        colorInput.className = 'hidden-color-picker';
        paletteBtn.addEventListener('click', (e) => { e.stopPropagation(); colorInput.click(); });
        colorInput.addEventListener('input', (e) => {
            const targetSpan = newSticker.querySelector('span');
            if (targetSpan) targetSpan.style.color = e.target.value;
            else newSticker.style.color = e.target.value;
        });
        newSticker.appendChild(paletteBtn);
        newSticker.appendChild(colorInput);
    }

        newSticker.addEventListener('dblclick', function(e) {
        e.stopPropagation();
        this.classList.toggle('locked');
        
        if (this.classList.contains('locked')) {
            window.clearSelection();
        } else {
            selectSticker(this);
        }
    });

    canvasContainer.appendChild(newSticker);
    selectSticker(newSticker);
};

        function getTouchPoint(e, id) {
            if (e.touches) {
                for (let i = 0; i < e.touches.length; i++) {
                    if (e.touches[i].identifier === id) return e.touches[i];
                }
                if (e.targetTouches && e.targetTouches[0]) return e.targetTouches[0];
                if (e.touches[0]) return e.touches[0];
                return null;
            }
            return e;
        }

        window.addEventListener('mousedown', handleStart);
        window.addEventListener('touchstart', handleStart, { passive: false });

function handleStart(e) {
            const target = e.target;

            if (window.templateManager && window.templateManager.isPlaying) {
                return;
            }

            if (target.closest('#menu-box') || target.closest('.side-drawer') || target.closest('#txt-export-overlay') || target.closest('#delete-btn') || target.closest('#mode-toggle-box')) {
                return;
            }

            const isSticker = target.classList.contains('sticker') || target.tagName === 'SPAN';
            const isHandle = target.classList.contains('resize-handle');
            const isRotate = target.classList.contains('rotate-handle');
            const isExpand = target.classList.contains('expand-handle');

            if (!isSticker && !isHandle && !isRotate && !isExpand) return;
            if (isExpand) return; 

            const element = target.closest('.sticker');
            if (!element) return;

            if (element.classList.contains('locked') && (!isHandle && !isRotate)) {
                selectSticker(element);
                return;
            }
            if (element.classList.contains('locked')) return;

            e.stopPropagation();
            selectSticker(element);
            
            if (isRotate) {
                currentAction = 'rotate';
            } else {
                currentAction = isHandle ? 'resize' : 'drag';
            }
            
            targetElement = element;
            targetElement.style.willChange = 'left, top, width, height, transform';
            
            if (e.touches) {
                activeTouchId = e.targetTouches[0] ? e.targetTouches[0].identifier : e.touches[e.touches.length - 1].identifier;
            }
                                    
            const point = getTouchPoint(e, activeTouchId);
            if (!point) return;
                                    
            startX = point.clientX;
            startY = point.clientY;
            initialLeft = element.offsetLeft;
            initialTop = element.offsetTop;
            initialWidth = element.offsetWidth;
            initialHeight = element.offsetHeight;

            const rect = element.getBoundingClientRect();
            element._centerX = rect.left + rect.width / 2;
            element._centerY = rect.top + rect.height / 2;
            element._startAngle = parseFloat(element.getAttribute('data-angle')) || 0;
            element._baseAngle = Math.atan2(point.clientY - element._centerY, point.clientX - element._centerX);
                                    
            if (e.touches) e.preventDefault();
        }

        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchmove', handleMove, { passive: false });

        function handleMove(e) {
    if (!currentAction || !targetElement) return;
    e.preventDefault();
    const point = getTouchPoint(e, activeTouchId);
    if (!point) return;

    const dx = point.clientX - startX;
    const dy = point.clientY - startY;

if (currentAction === 'drag') {
        const screenWidth = window.innerWidth;
        const screenHeight = window.innerHeight;
        const elWidth = targetElement.offsetWidth;
        const elHeight = targetElement.offsetHeight;
        const snapThreshold = 6;
        const overflowBuffer = 20;
        const resistanceThreshold = 4;

        let newLeft = initialLeft + dx;
        let newTop = initialTop + dy;

        if (Math.abs(newLeft) < snapThreshold) newLeft = 0;
        if (Math.abs(newLeft - (screenWidth - elWidth)) < snapThreshold) newLeft = screenWidth - elWidth;
        if (Math.abs(newTop) < snapThreshold) newTop = 0;
        if (Math.abs(newTop - (screenHeight - elHeight)) < snapThreshold) newTop = screenHeight - elHeight;

        const isAtLeft = initialLeft <= 0;
        const isAtRight = initialLeft >= (screenWidth - elWidth);
        const isAtTop = initialTop <= 0;
        const isAtBottom = initialTop >= (screenHeight - elHeight);

        if ((isAtLeft && dx < 0) || (isAtRight && dx > 0)) {
            let dist = isAtLeft ? Math.abs(newLeft) : (newLeft - (screenWidth - elWidth));
            if (dist < resistanceThreshold) {
                newLeft = isAtLeft ? 0 : (screenWidth - elWidth);
            } else {
                let clampedDist = Math.min(dist, overflowBuffer);
                newLeft = isAtLeft ? -clampedDist : (screenWidth - elWidth + clampedDist);
            }
        }

        // Top/Bottom 邏輯一致
        if ((isAtTop && dy < 0) || (isAtBottom && dy > 0)) {
            let dist = isAtTop ? Math.abs(newTop) : (newTop - (screenHeight - elHeight));
            if (dist < resistanceThreshold) {
                newTop = isAtTop ? 0 : (screenHeight - elHeight);
            } else {
                let clampedDist = Math.min(dist, overflowBuffer);
                newTop = isAtTop ? -clampedDist : (screenHeight - elHeight + clampedDist);
            }
        }

        targetElement.style.left = newLeft + 'px';
        targetElement.style.top = newTop + 'px';

        targetElement._centerX = newLeft + elWidth / 2;
        targetElement._centerY = newTop + elHeight / 2;
}
    else if (currentAction === 'resize') {
        let newWidth = initialWidth + dx;
        let newHeight = initialHeight + dy;

        if (modeCheckbox.checked) {
        targetElement.style.backgroundSize = '100% 100%';
        targetElement.style.width = newWidth + 'px';
        targetElement.style.height = newHeight + 'px';
    } else {
        // 等比縮放模式：恢復為原比例顯示
        targetElement.style.backgroundSize = 'contain';
        
        const ratioX = newWidth / initialWidth;
        const ratioY = newHeight / initialHeight;
        const scale = Math.max(ratioX, ratioY);
        targetElement.style.width = (initialWidth * scale) + 'px';
        targetElement.style.height = (initialHeight * scale) + 'px';
    }
} 
    else if (currentAction === 'rotate') {
        const currentAngle = Math.atan2(point.clientY - targetElement._centerY, point.clientX - targetElement._centerX);
        const angleDiff = currentAngle - targetElement._baseAngle;
        let newAngle = targetElement._startAngle + angleDiff * (180 / Math.PI);
        newAngle = (newAngle % 360 + 360) % 360;
        targetElement.setAttribute('data-angle', newAngle);
        targetElement.style.transform = `rotate(${newAngle}deg)`;
    }
}

        window.addEventListener('mouseup', handleEnd);
        window.addEventListener('touchend', handleEnd);
        window.addEventListener('touchcancel', handleEnd);

        function handleEnd() {
            if (targetElement) {
                targetElement.style.willChange = 'auto';
            }
            currentAction = null;
            targetElement = null;
            activeTouchId = null;
        }

        window.addEventListener('resize', function() {
            if (resizeTimeout) clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                document.querySelectorAll('.sticker').forEach(sticker => {
                    let currentLeft = sticker.offsetLeft;
                    let currentTop = sticker.offsetTop;
                    const maxLeft = window.innerWidth - sticker.offsetWidth;
                    const maxTop = window.innerHeight - sticker.offsetHeight;
                    if (currentLeft > maxLeft) sticker.style.left = Math.max(0, maxLeft) + 'px';
                    if (currentTop > maxTop) sticker.style.top = Math.max(0, maxTop) + 'px';
                });
            }, 100);
        });

// --- 動畫套用邏輯 ---
document.getElementById('animation-selector').addEventListener('change', function() {
    if (!selectedSticker) {
        alert("請先點選一張貼紙！");
        this.value = 'none'; // 重置選單
        return;
    }

    const selectedEffect = this.value;
    selectedSticker.classList.remove('breathing-effect', 'spin-effect', 'shake-effect', 'blink-effect', 'float-effect', 'skew-effect', 'glow-effect');
    if (selectedEffect !== 'none') {
        selectedSticker.classList.add(selectedEffect);
    }
});

    setTimeout(function() {
        switchCategory('bg', null);
        window.showMenuBox();
    }, 50);

// 側邊欄邏輯優化：點擊空白處收合，點擊功能元件保持面板狀態
    document.querySelectorAll('.side-drawer').forEach(panel => {
        panel.addEventListener('click', function(e) {
            // 只有點擊到「面板底層(this)」或「標題」時才觸發收合
            if (e.target === this || e.target.classList.contains('panel-title')) {
                this.classList.toggle('active');
            }
            // 阻止冒泡，避免點擊畫布觸發額外的關閉指令
            e.stopPropagation();
        });
    });


document.getElementById('canvas-container').addEventListener('click', function(e) {
    if (e.target === this) {
        window.clearSelection();
        
        document.querySelectorAll('.side-drawer').forEach(p => p.classList.remove('active'));
    }
});
</script>
